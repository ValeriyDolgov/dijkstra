spring:
  application:
    name: dijkstra
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://host.docker.internal:5432/node?prepareTreshold=0
    username: user
    password: postgres
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
logging:
  level:
    root: info
server:
  port: 8080
  servlet:
    context-path: /panel
cors:
  allowed-hosts: http://localhost:5173, http://dolgov.kz, https://dolgov.kz
