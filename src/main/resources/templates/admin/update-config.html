<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="_fragments.html :: head ('Редактировать настройки')">
</head>
<body>
<div th:insert="~{manager/navbar-manager}"></div>

<div class="container">
    <h1>Редактировать настройки дорог</h1>
    <br/>

    <form th:action="@{/admin/road-config/update}" th:object="${configs}" method="post">
        <h3>Настройки по типу покрытия (Surface)</h3>
        <div th:each="surface, iterStat : *{surfaceConfigs}" class="card mb-3 p-3 border">
            <input type="hidden" th:name="surfaceConfigs[__${iterStat.index}__].id" th:value="${surface.id}" />
            <div class="form-group">
                <label>Тип покрытия:</label>
                <input type="text" class="form-control" th:name="surfaceConfigs[__${iterStat.index}__].surface"
                       th:value="${surface.surface}" />
            </div>
            <div class="form-group">
                <label>Модификатор:</label>
                <input type="number" step="0.01" class="form-control"
                       th:name="surfaceConfigs[__${iterStat.index}__].multiplier"
                       th:value="${surface.multiplier}" />
            </div>
        </div>

        <h3>Настройки по типу дороги (Road Type)</h3>
        <div th:each="type, iterStat : *{typeConfigs}" class="card mb-3 p-3 border">
            <input type="hidden" th:name="typeConfigs[__${iterStat.index}__].id" th:value="${type.id}" />
            <div class="form-group">
                <label>Тип дороги:</label>
                <input type="text" class="form-control" th:name="typeConfigs[__${iterStat.index}__].type"
                       th:value="${type.type}" />
            </div>
            <div class="form-group">
                <label>Модификатор:</label>
                <input type="number" step="0.01" class="form-control"
                       th:name="typeConfigs[__${iterStat.index}__].multiplier"
                       th:value="${type.multiplier}" />
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
    </form>
</div>
</body>
</html>
