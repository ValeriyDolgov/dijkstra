<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршрут на Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <style>
        /* Лоадер */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid lightgray;
            border-top: 5px solid blue;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Размытие без лоадера */
        .blurred {
            filter: blur(5px);
            pointer-events: none;
        }

        .blurred #loader {
            filter: none;
        }

        /* Карта */
        #map {
            width: 100%;
            height: 500px;
        }

        /* Форма ввода */
        .input-container {
            margin: 10px auto;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input {
            padding: 5px;
            font-size: 14px;
            width: 150px;
        }

        #routeButton {
            padding: 10px 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="loader" style="display: none;">
    <div class="spinner"></div>
</div>
<div>
    <button onclick="showInput('address')">Ввод адреса</button>
    <button onclick="showInput('coords')">Ввод координат</button>
    <button onclick="showInput('map')">Выбор на карте</button>
</div>

<div id="addressInput" class="input-container">
    <label>Начальный адрес: <input type="text" id="start-address" placeholder="Введите адрес"></label>
    <button onclick="searchLocation('start')">Найти</button>
    <label>Конечный адрес: <input type="text" id="end-address" placeholder="Введите адрес"></label>
    <button onclick="searchLocation('end')">Найти</button>
    <button id="routeButtonAddress">Построить маршрут</button>
</div>

<div id="coordsInput" class="input-container">
    <label>Широта: <input type="text" id="startLat"></label>
    <label>Долгота: <input type="text" id="startLon"></label>
    <label>Широта: <input type="text" id="endLat"></label>
    <label>Долгота: <input type="text" id="endLon"></label>
    <button id="routeButtonCoord">Построить маршрут</button>
</div>

<div id="map"></div>

<script>
    let map;
    let routeLayer;
    let startCoordLat;
    let startCoordLon;
    let endCoordLat;
    let endCoordLon;
    let markers = [];
    let startMarker = null;
    let endMarker = null;


    document.addEventListener("DOMContentLoaded", function () {
        map = L.map('map').setView([48.0, 68.0], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.Control.geocoder().addTo(map);

        showInput('address');
    });

    function showInput(type) {
        document.querySelectorAll('.input-container').forEach(div => div.style.display = 'none');
        document.getElementById(type + 'Input').style.display = 'block';
    }

    async function getCoordinates(address) {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data.length > 0) {
                return {lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon)};
            } else {
                alert("Местоположение не найдено");
            }
        } catch (error) {
            console.error("Ошибка геокодирования:", error);
        }
    }

    function clearMarkers() {
        markers.forEach(marker => map.removeLayer(marker));
        markers = [];
    }

    async function searchLocation(type) {
        const address = type === "start" ? document.getElementById("start-address").value : document.getElementById("end-address").value;
        const coords = await getCoordinates(address);
        if (type === "start") {
            startCoordLat = coords.lat;
            startCoordLon = coords.lon;

            // Удалить предыдущий startMarker
            if (startMarker) {
                map.removeLayer(startMarker);
            }

            startMarker = L.marker([coords.lat, coords.lon])
                .addTo(map)
                .bindPopup(`Начальная точка: ${coords.lat}, ${coords.lon}`)
                .openPopup();
        } else {
            endCoordLat = coords.lat;
            endCoordLon = coords.lon;

            // Удалить предыдущий endMarker
            if (endMarker) {
                map.removeLayer(endMarker);
            }

            endMarker = L.marker([coords.lat, coords.lon])
                .addTo(map)
                .bindPopup(`Конечная точка: ${coords.lat}, ${coords.lon}`)
                .openPopup();
        }

        map.setView([coords.lat, coords.lon], 13);
    }

    document.getElementById("routeButtonAddress").addEventListener("click", async function () {

        const startLat = startCoordLat;
        const startLon = startCoordLon;
        const endLat = endCoordLat;
        const endLon = endCoordLon;

        if (isNaN(startLat) || isNaN(startLon) || isNaN(endLat) || isNaN(endLon)) {
            alert("Некорректные координаты!");
            return;
        }

        document.getElementById("loader").style.display = "flex";
        document.body.classList.add("blurred");

        try {
            const response = await fetch(`http://localhost:8080/api/routes?startLat=${startLat}&startLon=${startLon}&endLat=${endLat}&endLon=${endLon}`);
            const routeCoordinates = await response.json();

            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            routeLayer = L.polyline(routeCoordinates, {color: 'blue'}).addTo(map);
            map.fitBounds(routeLayer.getBounds());
        } catch (error) {
            console.error("Ошибка загрузки маршрута:", error);
        } finally {
            document.getElementById("loader").style.display = "none";
            document.body.classList.remove("blurred");
        }
    });

    document.getElementById("routeButtonCoord").addEventListener("click", async function () {
        const startLat = parseFloat(document.getElementById("startLat").value);
        const startLon = parseFloat(document.getElementById("startLon").value);
        const endLat = parseFloat(document.getElementById("endLat").value);
        const endLon = parseFloat(document.getElementById("endLon").value);

        if (isNaN(startLat) || isNaN(startLon) || isNaN(endLat) || isNaN(endLon)) {
            alert("Некорректные координаты!");
            return;
        }

        document.getElementById("loader").style.display = "flex";
        document.body.classList.add("blurred");

        try {
            const response = await fetch(`http://localhost:8080/api/routes?startLat=${startLat}&startLon=${startLon}&endLat=${endLat}&endLon=${endLon}`);
            const routeCoordinates = await response.json();

            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            routeLayer = L.polyline(routeCoordinates, {color: 'blue'}).addTo(map);
            map.fitBounds(routeLayer.getBounds());
        } catch (error) {
            console.error("Ошибка загрузки маршрута:", error);
        } finally {
            document.getElementById("loader").style.display = "none";
            document.body.classList.remove("blurred");
        }
    });
</script>

</body>
</html>
