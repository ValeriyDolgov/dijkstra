<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршрут на Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        /* Лоадер */
        #loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid lightgray;
            border-top: 5px solid blue;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Карта */
        #map {
            width: 100%;
            height: 500px;
            display: none; /* Скрыта по умолчанию */
        }

        /* Центрируем кнопку */
        #routeButton {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<!-- Лоадер -->
<div id="loader">
    <div class="spinner"></div>
</div>

<!-- Кнопка загрузки маршрута -->
<button id="routeButton" onclick="loadRoute()">Построить маршрут</button>

<!-- Контейнер для карты -->
<div id="map"></div>

<script>
    let map = null;
    let routeLayer = null;

    async function loadRoute() {
        const loader = document.getElementById("loader");
        const routeButton = document.getElementById("routeButton");
        const mapContainer = document.getElementById("map");

        try {
            // Показываем лоадер и блокируем кнопку
            loader.style.display = "flex";
            routeButton.disabled = true;
            routeButton.textContent = "Загрузка...";

            // Запрос маршрута
            const response = await fetch("http://localhost:8080/api/routes?startLat=54.8643387&startLon=69.1336783&endLat=43.2370583&endLon=76.924322");
            if (!response.ok) {
                throw new Error("Ошибка загрузки маршрута");
            }
            const routeData = await response.json();

            if (!Array.isArray(routeData) || routeData.length === 0) {
                throw new Error("Маршрут не найден");
            }

            // Показываем карту перед инициализацией
            mapContainer.style.display = "block";

            // Если карты ещё нет, создаём её
            if (!map) {
                setTimeout(() => {
                    map = L.map("map").setView(routeData[0], 13);
                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
                }, 100);
            }

            // Очищаем предыдущий маршрут
            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            // Добавляем новый маршрут
            routeLayer = L.polyline(routeData, {color: "blue"}).addTo(map);
            map.fitBounds(routeLayer.getBounds());

            // Обновляем размеры карты после появления
            setTimeout(() => {
                map.invalidateSize();
            }, 300);

        } catch (error) {
            console.error("Ошибка:", error.message);
        } finally {
            // Скрываем лоадер и разблокируем кнопку
            loader.style.display = "none";
            routeButton.disabled = false;
            routeButton.textContent = "Построить маршрут";
        }
    }
</script>

</body>
</html>
